services:
  mysql:
    image: mysql:8.0
    container_name: hebekery-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hebekery
    ports:
      - "3306:3306"
    volumes:
      - hebekery_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  hebekery_mysql_data:
