services:
  mysql:
    image: mysql:8.0
    container_name: hebekery_mysql
    restart: always
    environment:
      MYSQL_DATABASE: hebekery
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hebekery_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hebekery_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hebekery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - hebekery_net

  frontend:
    build:
      context: ./web-bakery-frontend
      dockerfile: Dockerfile
    container_name: hebekery_frontend
    restart: always
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - hebekery_net

  nginx:
    image: nginx:alpine
    container_name: hebekery_nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - hebekery_net

volumes:
  mysql_data:
  frontend_dist:

networks:
  hebekery_net:
    driver: bridge
