spring.application.name=hebekery
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hebekery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Migration
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# SePay & VietQR Payment Configuration (Tự động hóa chuyển khoản)
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:sepay_secret_key_12345}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:0987654321}
sepay.bank-code=${SEPAY_BANK_CODE:MBBank}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:TIEM BANH HEBEKERY}

# Cloudinary Media Configuration (Cloud Storage & CDN)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
