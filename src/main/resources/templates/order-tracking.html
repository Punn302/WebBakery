<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebekery | Kiểm tra đơn hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>
<main class="pt-28 pb-16 bg-[#fbfaf7] min-h-screen">
    <div class="max-w-4xl mx-auto px-4">
        <section class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
            <h1 class="text-3xl font-semibold text-gray-800">Kiểm tra đơn hàng</h1>
            <p class="text-gray-500 mt-2">Nhập mã đơn hoặc số điện thoại để tra cứu trạng thái.</p>
            <form id="trackingForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                <input id="trackingOrderId" class="border border-gray-200 rounded-lg px-4 py-3" placeholder="Mã đơn HBK-...">
                <input id="trackingPhone" class="border border-gray-200 rounded-lg px-4 py-3" placeholder="Số điện thoại">
                <button class="bg-[#47654c] text-white rounded-lg font-semibold">Tra cứu</button>
            </form>
            <div id="trackingResults" class="mt-6 space-y-4"></div>
        </section>
    </div>
</main>
<div th:replace="~{layout/fragments :: footer}"></div>
<script th:src="@{/js/order-tracking.js(v=1)}"></script>
</body>
</html>
