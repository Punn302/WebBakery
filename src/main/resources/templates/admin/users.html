<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Admin Users')}"></head>
<body class="bg-[#fbfaf7] text-gray-800">
<div class="min-h-screen lg:flex">
    <aside th:replace="~{admin/fragments :: sidebar('users')}"></aside>
    <main class="flex-1 px-4 md:px-8 py-8">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-6">
            <h1 class="text-3xl font-semibold text-[#263d2b]">Qu&#7843;n l&#253; ng&#432;&#7901;i d&#249;ng</h1>
            <form method="get" class="flex gap-2">
                <input name="keyword" th:value="${keyword}" class="border border-gray-200 rounded-lg px-4 py-3" placeholder="T&#236;m t&#234;n, email, S&#272;T">
                <button class="bg-[#47654c] text-white px-5 py-3 rounded-lg font-semibold">T&#236;m</button>
            </form>
        </div>
        <section class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-[#f7f3ec] text-gray-600">
                <tr>
                    <th class="text-left px-6 py-4">T&#234;n</th>
                    <th class="text-left px-6 py-4">Email</th>
                    <th class="text-left px-6 py-4">S&#272;T</th>
                    <th class="text-left px-6 py-4">Vai tr&#242;</th>
                    <th class="text-left px-6 py-4">Qu&#7843;n l&#253;</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${page.content}" class="border-t border-gray-100">
                    <td class="px-6 py-4 font-semibold" th:text="${user.name}"></td>
                    <td class="px-6 py-4" th:text="${user.email}"></td>
                    <td class="px-6 py-4" th:text="${user.phone}"></td>
                    <td class="px-6 py-4" th:text="${user.role}"></td>
                    <td class="px-6 py-4">
                        <form th:action="@{/admin/users/{id}/update(id=${user.id})}" method="post" class="flex flex-wrap gap-2">
                            <select name="role" class="border border-gray-200 rounded-lg px-3 py-2">
                                <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                                <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                            </select>
                            <label class="inline-flex items-center gap-2 border border-gray-200 rounded-lg px-3 py-2">
                                <input type="checkbox" name="active" value="true" th:checked="${user.active}">
                                Active
                            </label>
                            <label th:if="${user.role == 'USER'}" class="inline-flex items-center gap-2 border border-amber-200 text-amber-700 rounded-lg px-3 py-2">
                                <input type="checkbox" name="resetDefaultPassword" value="true">
                                Reset v&#7873; 123456
                            </label>
                            <button class="bg-[#47654c] text-white rounded-lg px-3 py-2 font-semibold">L&#432;u</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
        <div th:replace="~{admin/pagination :: pager('/admin/users', ${page}, ${keyword})}"></div>
    </main>
</div>
<script th:replace="~{admin/fragments :: logoutScript}"></script>
</body>
</html>
