<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pager(baseUrl, page, keyword)" class="flex items-center justify-between mt-6 text-sm">
    <p class="text-gray-500">Trang <span th:text="${page.number + 1}">1</span>/<span th:text="${page.totalPages == 0 ? 1 : page.totalPages}">1</span></p>
    <div class="flex gap-2">
        <a th:if="${page.hasPrevious()}" th:href="${baseUrl + '?page=' + (page.number - 1) + '&keyword=' + keyword}" class="px-4 py-2 rounded-lg border border-gray-200 bg-white">Trước</a>
        <a th:if="${page.hasNext()}" th:href="${baseUrl + '?page=' + (page.number + 1) + '&keyword=' + keyword}" class="px-4 py-2 rounded-lg border border-gray-200 bg-white">Sau</a>
    </div>
</div>
</body>
</html>
