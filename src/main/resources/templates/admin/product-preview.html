<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Xem ảnh sản phẩm')}"></head>
<body class="bg-[#fbfaf7] text-gray-800">
<div class="min-h-screen lg:flex">
    <aside th:replace="~{admin/fragments :: sidebar('products')}"></aside>
    <main class="flex-1 px-4 md:px-8 py-8">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-6">
            <div>
                <p class="text-sm uppercase tracking-wider text-[#47654c] font-semibold">Preview ảnh</p>
                <h1 class="text-3xl font-semibold" th:text="${product.name}">Sản phẩm</h1>
                <p class="text-gray-500 mt-2" th:text="${product.imageUrl}"></p>
            </div>
            <div class="flex gap-3">
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="border border-gray-200 rounded-lg px-5 py-3 font-semibold bg-white">Sửa sản phẩm</a>
                <a href="/admin/products" class="border border-gray-200 rounded-lg px-5 py-3 font-semibold bg-white">Quay lại</a>
            </div>
        </div>
        <section class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
            <img th:src="${product.imageUrl}" th:alt="${product.name}" class="w-full max-h-[75vh] object-contain rounded-lg bg-gray-50">
        </section>
    </main>
</div>
<script th:replace="~{admin/fragments :: logoutScript}"></script>
</body>
</html>
