<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebekery | San pham</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="pt-24 pb-16 bg-[#fbfaf7] min-h-screen">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-semibold text-gray-800 mb-3">S&#7843;n ph&#7849;m Hebekery</h1>
            <p th:if="${keyword == null or keyword.isBlank()}" class="text-gray-500 max-w-2xl mx-auto">Danh m&#7909;c healthy bakery, snack v&#224; combo qu&#224; t&#7863;ng.</p>
            <p th:if="${keyword != null and !keyword.isBlank()}" class="text-gray-500 max-w-2xl mx-auto">K&#7871;t qu&#7843; t&#236;m ki&#7871;m cho <span class="font-semibold text-[#47654c]" th:text="${keyword}"></span></p>
        </div>

        <div class="flex flex-wrap justify-center gap-3 mb-10">
            <a th:href="@{/products(category='all')}"
               th:classappend="${(currentCategory == null or currentCategory == 'all') and (keyword == null or keyword.isBlank())} ? ' bg-[#47654c] text-white' : ' bg-white text-gray-600 border border-gray-200'"
               class="px-5 py-2 rounded-full text-sm font-semibold transition-all">T&#7845;t c&#7843;</a>
            <a th:each="category : ${categories}"
               th:href="@{/products(category=${category})}"
               th:classappend="${currentCategory == category and (keyword == null or keyword.isBlank())} ? ' bg-[#47654c] text-white' : ' bg-white text-gray-600 border border-gray-200'"
               class="px-5 py-2 rounded-full text-sm font-semibold transition-all"
               th:text="${category}"></a>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="productsGrid">
            <a th:each="product : ${products}"
               th:href="@{/product/{id}(id=${product.id})}"
               class="product-card group cursor-pointer block">
                <div class="aspect-square mb-4 overflow-hidden rounded-xl bg-white shadow-md hover-lift">
                    <img th:src="@{${product.imageUrl}}" th:alt="${product.name}"
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="text-center">
                    <span class="text-xs text-[#47654c] uppercase tracking-wider" th:text="${product.badge}"></span>
                    <h3 class="text-lg font-semibold text-gray-800 mt-2 mb-1" th:text="${product.name}">San pham</h3>
                    <p class="text-sm text-gray-500 mb-2 line-clamp-2" th:text="${product.description}">Mo ta</p>
                    <p class="text-lg font-bold text-[#47654c] mb-3" th:text="${#numbers.formatDecimal(product.price, 0, 0, 'COMMA') + ' d'}">0 d</p>
                    <button type="button" class="quick-add" th:attr="data-product-id=${product.id}">Th&#234;m v&#224;o gi&#7887;</button>
                </div>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="text-center py-12">
            <span class="material-symbols-outlined text-5xl text-gray-300">search_off</span>
            <p class="text-gray-400 mt-3">Kh&#244;ng c&#243; s&#7843;n ph&#7849;m ph&#249; h&#7907;p.</p>
        </div>

        <div th:if="${page.totalPages > 1}" class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mt-10 text-sm">
            <p class="text-gray-500">Trang <span th:text="${page.number + 1}">1</span>/<span th:text="${page.totalPages}">1</span></p>
            <div class="flex flex-wrap gap-2">
                <a th:if="${page.hasPrevious()}"
                   th:href="@{/products(page=${page.number - 1},category=${currentCategory},keyword=${keyword})}"
                   class="px-4 py-2 rounded-lg border border-gray-200 bg-white">Tr&#432;&#7899;c</a>
                <a th:each="pageIndex : ${#numbers.sequence(0, page.totalPages - 1)}"
                   th:href="@{/products(page=${pageIndex},category=${currentCategory},keyword=${keyword})}"
                   th:classappend="${pageIndex == page.number} ? ' bg-[#47654c] text-white border-[#47654c]' : ' bg-white text-gray-600 border-gray-200'"
                   class="px-4 py-2 rounded-lg border"
                   th:text="${pageIndex + 1}">1</a>
                <a th:if="${page.hasNext()}"
                   th:href="@{/products(page=${page.number + 1},category=${currentCategory},keyword=${keyword})}"
                   class="px-4 py-2 rounded-lg border border-gray-200 bg-white">Sau</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
<script th:src="@{/js/products.js(v=3)}"></script>
</body>
</html>
