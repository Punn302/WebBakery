<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebekery | MoMo Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>
<main class="pt-32 pb-20 min-h-screen bg-[#fbfaf7]">
    <div class="max-w-2xl mx-auto px-4 bg-white rounded-xl border border-gray-100 shadow-sm py-10 text-center">
        <span class="material-symbols-outlined text-6xl text-[#47654c]">payments</span>
        <h1 class="text-3xl font-semibold text-gray-800 mt-4">Thanh toán MoMo test</h1>
        <p class="text-gray-500 mt-3">
            Đây là màn hình giả lập MoMo. Đơn hàng chưa được lưu cho đến khi bạn xác nhận thanh toán thành công.
        </p>
        <div class="mt-6 bg-[#f7f3ec] rounded-lg p-4 text-left">
            <p class="font-semibold text-[#263d2b]">Luồng xử lý</p>
            <p class="text-sm text-gray-500 mt-1">Nhấn thanh toán: tạo đơn hàng và chuyển sang trang thành công.</p>
            <p class="text-sm text-gray-500 mt-1">Nhấn hủy giao dịch: quay lại thanh toán, giữ giỏ hàng và không lưu đơn.</p>
        </div>
        <div class="mt-8 flex flex-col sm:flex-row justify-center gap-3">
            <form method="post" action="/checkout/momo-test/pay">
                <button class="w-full sm:w-auto px-6 py-3 rounded-full bg-[#47654c] text-white font-semibold">
                    Thanh toán thành công
                </button>
            </form>
            <form method="post" action="/checkout/momo-test/cancel">
                <button class="w-full sm:w-auto px-6 py-3 rounded-full border border-gray-200 text-gray-600 font-semibold">
                    Hủy giao dịch
                </button>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
