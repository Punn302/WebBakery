<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebekery | Thanh toán thành công</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>
<main class="pt-32 pb-20 min-h-screen bg-[#fbfaf7]">
    <div class="max-w-2xl mx-auto px-4 text-center bg-white rounded-xl border border-gray-100 shadow-sm py-12">
        <span class="material-symbols-outlined text-6xl text-[#47654c]">check_circle</span>
        <h1 class="text-3xl font-semibold text-gray-800 mt-4">Đơn hàng đã được ghi nhận</h1>
        <p class="text-gray-500 mt-3">Cảm ơn bạn đã mua hàng tại Hebekery.</p>
        <div class="mt-8 flex justify-center gap-3">
            <a href="/profile" class="px-6 py-3 rounded-full bg-[#47654c] text-white font-semibold">Xem đơn hàng</a>
            <a href="/products" class="px-6 py-3 rounded-full border border-gray-200 text-gray-600 font-semibold">Tiếp tục mua sắm</a>
        </div>
    </div>
</main>
<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
