<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebekery | Tài khoản của tôi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="pt-28 pb-16 bg-[#fbfaf7] min-h-screen">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <p class="text-sm uppercase tracking-wider text-[#47654c] font-semibold">Tài khoản</p>
                    <h1 id="userNameDisplay" class="text-3xl font-semibold text-gray-800 mt-1" th:text="${user.name}">Người dùng</h1>
                    <p id="userEmailDisplay" class="text-gray-500 mt-1" th:text="${user.email}">email@example.com</p>
                </div>
                <button id="logoutNav" class="inline-flex items-center gap-2 px-5 py-3 rounded-full border border-gray-200 text-red-500 font-semibold">
                    <span class="material-symbols-outlined text-base">logout</span>
                    Đăng xuất
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <aside class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 h-fit">
                <button class="profile-nav-item active w-full text-left px-4 py-3 rounded-lg font-semibold text-[#47654c] bg-[#f7f3ec]" data-tab="profile">Thông tin cá nhân</button>
                <button class="profile-nav-item w-full text-left px-4 py-3 rounded-lg font-semibold text-gray-600 hover:bg-[#f7f3ec]" data-tab="password">Đổi mật khẩu</button>
                <button class="profile-nav-item w-full text-left px-4 py-3 rounded-lg font-semibold text-gray-600 hover:bg-[#f7f3ec]" data-tab="addresses">Sổ địa chỉ</button>
                <button class="profile-nav-item w-full text-left px-4 py-3 rounded-lg font-semibold text-gray-600 hover:bg-[#f7f3ec]" data-tab="orders">Đơn hàng</button>
            </aside>

            <section class="lg:col-span-3">
                <div id="tab-profile" class="tab-content bg-white rounded-xl border border-gray-100 shadow-sm p-6">
                    <div id="profileView">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="border border-gray-100 rounded-lg p-4"><p class="text-sm text-gray-400">Họ tên</p><p id="profileName" class="font-semibold text-gray-800 mt-1" th:text="${user.name}"></p></div>
                            <div class="border border-gray-100 rounded-lg p-4"><p class="text-sm text-gray-400">Email</p><p id="profileEmail" class="font-semibold text-gray-800 mt-1" th:text="${user.email}"></p></div>
                            <div class="border border-gray-100 rounded-lg p-4"><p class="text-sm text-gray-400">Số điện thoại</p><p id="profilePhone" class="font-semibold text-gray-800 mt-1" th:text="${user.phone}"></p></div>
                            <div class="border border-gray-100 rounded-lg p-4"><p class="text-sm text-gray-400">Ngày tham gia</p><p id="profileJoinDate" class="font-semibold text-gray-800 mt-1">Hôm nay</p></div>
                        </div>
                        <button id="editProfileBtn" class="mt-6 bg-[#47654c] text-white px-6 py-3 rounded-full font-semibold">Cập nhật thông tin</button>
                    </div>
                    <div id="profileEdit" class="hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label class="block text-sm font-semibold text-gray-700 mb-2">Họ tên</label><input id="editName" class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]"></div>
                            <div><label class="block text-sm font-semibold text-gray-700 mb-2">Số điện thoại</label><input id="editPhone" class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]"></div>
                        </div>
                        <div class="mt-6 flex gap-3">
                            <button id="saveProfileBtn" class="bg-[#47654c] text-white px-6 py-3 rounded-full font-semibold">Lưu</button>
                            <button id="cancelEditBtn" class="border border-gray-200 px-6 py-3 rounded-full font-semibold text-gray-600">Hủy</button>
                        </div>
                    </div>
                </div>

                <div id="tab-password" class="tab-content hidden bg-white rounded-xl border border-gray-100 shadow-sm p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-5">Đổi mật khẩu</h2>
                    <div class="space-y-4 max-w-xl">
                        <input id="currentPassword" type="password" class="w-full border border-gray-200 rounded-lg px-4 py-3" placeholder="Mật khẩu hiện tại">
                        <input id="newPassword" type="password" class="w-full border border-gray-200 rounded-lg px-4 py-3" placeholder="Mật khẩu mới">
                        <input id="confirmNewPassword" type="password" class="w-full border border-gray-200 rounded-lg px-4 py-3" placeholder="Nhập lại mật khẩu mới">
                        <button id="changePasswordBtn" class="bg-[#47654c] text-white px-6 py-3 rounded-full font-semibold">Đổi mật khẩu</button>
                    </div>
                </div>

                <div id="tab-addresses" class="tab-content hidden bg-white rounded-xl border border-gray-100 shadow-sm p-6">
                    <div class="flex items-center justify-between gap-4 mb-5">
                        <h2 class="text-xl font-semibold text-gray-800">Sổ địa chỉ</h2>
                        <button id="newAddressBtn" class="bg-[#47654c] text-white px-5 py-3 rounded-full font-semibold">Thêm địa chỉ</button>
                    </div>
                    <form id="addressForm" class="hidden border border-gray-100 rounded-xl p-4 mb-5 space-y-3" data-address-id="">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input id="addressReceiverName" class="border border-gray-200 rounded-lg px-4 py-3" placeholder="Người nhận">
                            <input id="addressPhone" class="border border-gray-200 rounded-lg px-4 py-3" placeholder="Số điện thoại">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <select id="profileProvinceSelect" class="border border-gray-200 rounded-lg px-4 py-3"><option value="">Tỉnh/thành phố</option></select>
                            <select id="profileDistrictSelect" class="border border-gray-200 rounded-lg px-4 py-3" disabled><option value="">Quận/huyện</option></select>
                            <select id="profileWardSelect" class="border border-gray-200 rounded-lg px-4 py-3" disabled><option value="">Phường/xã</option></select>
                        </div>
                        <textarea id="addressLine" rows="2" class="w-full border border-gray-200 rounded-lg px-4 py-3" placeholder="Số nhà, tên đường"></textarea>
                        <label class="flex items-center gap-2 text-sm text-gray-600"><input id="addressDefault" type="checkbox"> Đặt làm địa chỉ mặc định</label>
                        <div class="flex gap-2">
                            <button class="bg-[#47654c] text-white rounded-full px-5 py-3 font-semibold">Lưu địa chỉ</button>
                            <button id="cancelAddressBtn" type="button" class="border border-gray-200 rounded-full px-5 py-3 font-semibold">Hủy</button>
                        </div>
                    </form>
                    <div id="addressesList" class="space-y-4"></div>
                </div>

                <div id="tab-orders" class="tab-content hidden bg-white rounded-xl border border-gray-100 shadow-sm p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-5">Đơn hàng của tôi</h2>
                    <div id="ordersList" class="space-y-4"></div>
                </div>
            </section>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/profile.js(v=3)}"></script>
</body>
</html>
