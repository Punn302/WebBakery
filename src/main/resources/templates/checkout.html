<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebekery | Thanh toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="pt-28 pb-16 bg-[#fbfaf7] min-h-screen">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="mb-8">
            <h1 class="text-3xl md:text-4xl font-semibold text-gray-800">Thanh toán</h1>
            <p class="text-gray-500 mt-2">Xác nhận thông tin nhận hàng và phương thức thanh toán.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <section class="lg:col-span-2 bg-white border border-gray-100 rounded-xl p-6 shadow-sm">
                <form id="checkoutForm" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Họ tên</label>
                            <input id="customerName" class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]" th:value="${user.name}" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Số điện thoại</label>
                            <input id="phone" class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]" th:value="${user.phone}" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Địa chỉ nhận hàng</label>
                        <div id="savedAddressPanel" th:if="${!#lists.isEmpty(addresses)}" class="space-y-3">
                            <div id="currentSavedAddress"
                                 class="rounded-xl border border-[#dce8dd] bg-[#f7fbf7] p-4"
                                 th:if="${defaultAddress != null}"
                                 th:attr="data-id=${defaultAddress.id},data-name=${defaultAddress.receiverName},data-phone=${defaultAddress.phone},data-line=${defaultAddress.addressLine},data-province=${defaultAddress.province},data-district=${defaultAddress.district},data-ward=${defaultAddress.ward}">
                                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
                                    <div>
                                        <p class="font-semibold text-gray-800" th:text="${defaultAddress.receiverName}">Người nhận</p>
                                        <p class="text-sm text-gray-500" th:text="${defaultAddress.phone}">SĐT</p>
                                        <p class="text-sm text-gray-600 mt-1" th:text="${defaultAddress.addressLine + ', ' + defaultAddress.ward + ', ' + defaultAddress.district + ', ' + defaultAddress.province}">Địa chỉ</p>
                                    </div>
                                    <span th:if="${defaultAddress.defaultAddress}" class="text-xs font-semibold text-[#47654c] bg-white rounded-full px-3 py-1">Mặc định</span>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button id="changeSavedAddressBtn" type="button" class="border border-gray-200 rounded-full px-4 py-2 text-sm font-semibold text-gray-600">Đổi địa chỉ</button>
                                <button id="useNewAddressBtn" type="button" class="border border-[#47654c] rounded-full px-4 py-2 text-sm font-semibold text-[#47654c]">Nhập địa chỉ mới</button>
                            </div>
                            <div id="addressChoices" class="hidden space-y-3">
                                <button th:each="address : ${addresses}"
                                        type="button"
                                        class="saved-address-option w-full text-left rounded-xl border border-gray-100 bg-white p-4 hover:border-[#47654c]"
                                        th:attr="data-id=${address.id},data-name=${address.receiverName},data-phone=${address.phone},data-line=${address.addressLine},data-province=${address.province},data-district=${address.district},data-ward=${address.ward},data-default=${address.defaultAddress}">
                                    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
                                        <div>
                                            <p class="font-semibold text-gray-800" th:text="${address.receiverName}">Người nhận</p>
                                            <p class="text-sm text-gray-500" th:text="${address.phone}">SĐT</p>
                                            <p class="text-sm text-gray-600 mt-1" th:text="${address.addressLine + ', ' + address.ward + ', ' + address.district + ', ' + address.province}">Địa chỉ</p>
                                        </div>
                                        <span th:if="${address.defaultAddress}" class="text-xs font-semibold text-[#47654c] bg-[#f7f3ec] rounded-full px-3 py-1">Mặc định</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                        <div id="newAddressForm" th:classappend="${!#lists.isEmpty(addresses)} ? ' hidden' : ''" class="space-y-3">
                            <div th:if="${!#lists.isEmpty(addresses)}" class="flex justify-end">
                                <button id="useSavedAddressBtn" type="button" class="text-sm font-semibold text-[#47654c]">Dùng địa chỉ đã lưu</button>
                            </div>
                            <p id="provinceLoadingText" class="text-sm text-gray-400">Đang tải danh sách tỉnh/thành...</p>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <select id="provinceSelect" class="border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]">
                                    <option value="">Tỉnh/thành phố</option>
                                </select>
                                <select id="districtSelect" class="border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]" disabled>
                                    <option value="">Quận/huyện</option>
                                </select>
                                <select id="wardSelect" class="border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]" disabled>
                                    <option value="">Phường/xã</option>
                                </select>
                            </div>
                            <textarea id="address" rows="3" class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]" placeholder="Số nhà, tên đường" th:required="${#lists.isEmpty(addresses)}"></textarea>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Ghi chú</label>
                        <textarea id="note" rows="2" class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-[#47654c]" placeholder="Thời gian nhận hàng, lưu ý giao hàng..."></textarea>
                    </div>

                    <div>
                        <h2 class="text-lg font-semibold text-gray-800 mb-3">Phương thức thanh toán</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <label class="payment-card border border-[#47654c] bg-[#f7f3ec] rounded-xl p-4 cursor-pointer">
                                <input type="radio" name="paymentMethod" value="COD" class="mr-2" checked>
                                <span class="font-semibold text-gray-800">COD</span>
                                <p class="text-sm text-gray-500 mt-2">Thanh toán tiền mặt khi nhận hàng.</p>
                            </label>
                            <label class="payment-card border border-gray-200 rounded-xl p-4 cursor-pointer">
                                <input type="radio" name="paymentMethod" value="MOMO" class="mr-2">
                                <span class="font-semibold text-gray-800">MoMo</span>
                            </label>
                        </div>
                    </div>

                    <div id="checkoutMessage" class="hidden rounded-lg px-4 py-3 text-sm"></div>

                    <button type="submit" class="w-full md:w-auto bg-[#47654c] text-white px-8 py-3 rounded-full font-semibold hover:bg-[#3a543e] transition">
                        Xác nhận đặt hàng
                    </button>
                </form>
            </section>

            <aside class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm h-fit">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Đơn hàng</h2>
                <div class="space-y-4 mb-5">
                    <div th:each="item : ${cartItems}" class="flex gap-3">
                        <img th:src="@{${item.imageUrl}}" th:alt="${item.productName}" class="w-14 h-14 rounded-lg object-cover">
                        <div class="flex-1">
                            <p class="text-sm font-semibold text-gray-800" th:text="${item.productName}"></p>
                            <p class="text-xs text-gray-400">SL: <span th:text="${item.quantity}"></span></p>
                        </div>
                        <span class="text-sm font-semibold text-[#47654c]" th:text="${#strings.replace(#numbers.formatDecimal(item.total, 0, 'COMMA', 0, 'POINT'), ',', '.') + 'đ'}"></span>
                    </div>
                </div>
                <div class="border-t border-gray-100 pt-4 space-y-3 text-sm">
                    <div class="flex justify-between"><span class="text-gray-500">Tạm tính</span><span th:text="${#strings.replace(#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT'), ',', '.') + 'đ'}"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">Vận chuyển</span><span th:text="${#strings.replace(#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT'), ',', '.') + 'đ'}"></span></div>
                    <div class="flex justify-between text-lg font-bold text-gray-800 pt-3 border-t border-gray-100"><span>Tổng</span><span class="text-[#47654c]" th:text="${#strings.replace(#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT'), ',', '.') + 'đ'}"></span></div>
                </div>
            </aside>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/checkout.js(v=4)}"></script>
</body>
</html>
