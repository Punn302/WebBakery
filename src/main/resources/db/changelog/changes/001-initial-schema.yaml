              - column:
                  name: reason
                  type: varchar(1000)
              - column:
                  name: admin_note
                  type: varchar(1000)
              - column:
                  name: changed_by
                  type: varchar(64)
              - column:
                  name: created_at
                  type: datetime
        - createIndex:
            indexName: idx_return_history_order_id
            tableName: return_history
            columns:
              - column:
                  name: order_id
