  - changeSet:
      id: 006-insert-rich-healthy-bakery-products
      author: hebekery
      changes:
        - insert:
            tableName: products
            columns:
              - column: { name: id, value: "P018" }
              - column: { name: name, value: "Bánh Mì Nguyên Cám Men Tự Nhiên Sourdough" }
              - column: { name: category, value: "Bánh ăn kiêng" }
              - column: { name: category_id, valueNumeric: 2 }
              - column: { name: description, value: "Bánh mì sourdough 100% bột lúa mạch đen nguyên cám, lên men tự nhiên 24 giờ. Chỉ số đường huyết GI thấp, giàu chất xơ prebiotic, không phụ gia, phù hợp người tiểu đường và ăn kiêng Eat Clean." }
              - column: { name: price, valueNumeric: 125000 }
              - column: { name: image_url, value: "https://res.cloudinary.com/dw41xzins/image/upload/v1793892652/hebekery/products/hebekery_whole_wheat_sourdough.jpg" }
              - column: { name: badge, value: "Men tự nhiên" }
              - column: { name: tag, value: "Eat Clean" }
              - column: { name: stock_quantity, valueNumeric: 50 }
              - column: { name: low_stock_threshold, valueNumeric: 5 }
              - column: { name: average_cost, valueNumeric: 75000 }
              - column: { name: active, valueBoolean: true }
              - column: { name: is_featured, valueBoolean: true }

        - insert:
            tableName: products
            columns:
              - column: { name: id, value: "P019" }
              - column: { name: name, value: "Bánh Chuối Yến Mạch Nướng Không Đường" }
              - column: { name: category, value: "Bánh ăn kiêng" }
              - column: { name: category_id, valueNumeric: 2 }
              - column: { name: description, value: "Bánh chuối yến mạch mềm ẩm tự nhiên, vị ngọt thanh từ 100% chuối tiêu chín cây và mật ong rừng. Không đường tinh luyện, không bơ động vật, lý tưởng cho bữa phụ lành mạnh trước và sau tập luyện." }
              - column: { name: price, valueNumeric: 145000 }
              - column: { name: image_url, value: "https://res.cloudinary.com/dw41xzins/image/upload/v1793892653/hebekery/products/hebekery_banana_oat_bread.jpg" }
              - column: { name: badge, value: "Không đường" }
              - column: { name: tag, value: "Năng lượng" }
              - column: { name: stock_quantity, valueNumeric: 60 }
              - column: { name: low_stock_threshold, valueNumeric: 5 }
              - column: { name: average_cost, valueNumeric: 85000 }
              - column: { name: active, valueBoolean: true }
              - column: { name: is_featured, valueBoolean: true }

        - insert:
            tableName: products
            columns:
              - column: { name: id, value: "P020" }
              - column: { name: name, value: "Bánh Quy Hạt Lanh & Hạnh Nhân Ăn Kiêng" }
              - column: { name: category, value: "Bánh ăn kiêng" }
              - column: { name: category_id, valueNumeric: 2 }
              - column: { name: description, value: "Bánh quy hạt lanh vàng kết hợp bột hạnh nhân Mỹ cao cấp. Hàm lượng tinh bột siêu thấp, giàu axit béo Omega-3 và chất xơ hòa tan. Tuyệt phẩm cho người theo chế độ Keto và Low-Carb." }
              - column: { name: price, valueNumeric: 165000 }
              - column: { name: image_url, value: "https://res.cloudinary.com/dw41xzins/image/upload/v1793892654/hebekery/products/hebekery_flaxseed_almond_cookies.jpg" }
              - column: { name: badge, value: "Keto Friendly" }
              - column: { name: tag, value: "Low-Carb" }
              - column: { name: stock_quantity, valueNumeric: 70 }
