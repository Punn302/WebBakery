              - column: { name: average_cost, valueNumeric: 105000 }
              - column: { name: active, valueBoolean: true }
              - column: { name: is_featured, valueBoolean: false }

        - insert:
            tableName: products
            columns:
              - column: { name: id, value: "P021" }
              - column: { name: name, value: "Granola Dâu Tây & Quả Mọng Sấy Giòn" }
              - column: { name: category, value: "Ngũ cốc & Granola" }
              - column: { name: category_id, valueNumeric: 1 }
              - column: { name: description, value: "Granola yến mạch Úc nướng giòn rụm cùng mật hoa dừa hữu cơ, hòa quyện với dâu tây, việt quất và nam việt quất sấy thăng hoa công nghệ cao. Vị chua ngọt cân bằng, giàu chất chống oxy hóa tự nhiên." }
