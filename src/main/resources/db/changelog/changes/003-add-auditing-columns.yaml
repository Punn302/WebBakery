databaseChangeLog:
  - changeSet:
      id: 003-add-auditing-to-users
      author: hebekery
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: created_by
                  type: varchar(100)
              - column:
                  name: updated_by
                  type: varchar(100)

