databaseChangeLog:
  - changeSet:
      id: 013-add-audit-logs-table
      author: dev
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: actor
                  type: VARCHAR(255)
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
